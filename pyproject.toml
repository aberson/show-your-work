[project]
name = "show-your-work"
version = "0.1.0"
description = "Scaffold, validate and render a per-project docs/workflows/ folder of mermaid workflow diagrams."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
show-your-work = "show_your_work.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
render = [
    "mermaidx==0.9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/show_your_work"]

# The init templates live at the repo root (plan section 3.6) and ship inside the wheel as
# package data, where scaffold.py finds them through importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"templates/workflows" = "show_your_work/templates/workflows"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
